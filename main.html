<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            LOQO
        </div>
        <nav class="navigation">
            <a href="#trending">
                Trending
            </a>
            <a href="#popular">
                Popular
            </a>
            <a href="#top-rated">
                Top Rated
            </a>
            <a href="#upcoming">
                Upcoming
            </a>
        </nav>
        <div class="header-icons">
            <button
                class="icon-button"
                title="Search"
                onclick="openSearch()"
            >
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
            <button
                class="icon-button"
                title="Sign In"
                onclick="goToSignIn()"
            >
                <i class="fa-solid fa-right-to-bracket"></i>
            </button>
        </div>
    </header>
    <div class="search-container" id="searchContainer">
        <input
            type="text"
            id="searchInput"
            placeholder="Search for a movie..."
            onkeyup="searchMovies()"
        >
        <button onclick="closeSearch()">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>
    <section class="hero" id="hero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 id="heroTitle">
                Backrooms
            </h1>
            <p id="heroDescription">
                A strange doorway appears in the basement
                of a furniture showroom.
            </p>
            <div class="hero-buttons">
                <button
                    class="watch-button"
                    onclick="watchMovie()"
                >
                    <i class="fa-regular fa-circle-play"></i>
                    Watch Now
                </button>
                <button
                    class="info-button"
                    onclick="movieInfo()"
                >
                    <i class="fa-solid fa-circle-info"></i>
                    View Info
                </button>
            </div>
        </div>
        <div class="hero-poster">
            <img
                id="heroPoster"
                src="https://image.tmdb.org/t/p/original/dqmMWNWfLnExDRpMtIMqI97GQFR.jpg"
                alt="Featured movie"
            >
        </div>
    </section>
    <main class="movie-content">
        <section
            class="movie-section"
            id="trending"
        >
            <h2>
                Trending Movies
            </h2>
            <div class="movie-row">
                <button
                    class="carousel-arrow left"
                    onclick="scrollMovies('trendingMovies', -1)"
                >
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <div
                    class="movie-list"
                    id="trendingMovies"
                ></div>
                <button
                    class="carousel-arrow right"
                    onclick="scrollMovies('trendingMovies', 1)"
                >
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
        </section>
        <section
            class="movie-section"
            id="popular"
        >
            <h2>
                Popular Movies
            </h2>
            <div class="movie-row">
                <button
                    class="carousel-arrow left"
                    onclick="scrollMovies('popularMovies', -1)"
                >
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <div
                    class="movie-list"
                    id="popularMovies"
                ></div>
                <button
                    class="carousel-arrow right"
                    onclick="scrollMovies('popularMovies', 1)"
                >
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
        </section>
        <section
            class="movie-section"
            id="top-rated"
        >
            <h2>
                Top Rated Movies
            </h2>
            <div class="movie-row">
                <button
                    class="carousel-arrow left"
                    onclick="scrollMovies('topRatedMovies', -1)"
                >
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <div
                    class="movie-list"
                    id="topRatedMovies"
                ></div>
                <button
                    class="carousel-arrow right"
                    onclick="scrollMovies('topRatedMovies', 1)"
                >
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
        </section>
        <section
            class="movie-section"
            id="upcoming"
        >
            <h2>
                Upcoming Movies
            </h2>
            <div class="movie-row">
                <button
                    class="carousel-arrow left"
                    onclick="scrollMovies('upcomingMovies', -1)"
                >
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <div
                    class="movie-list"
                    id="upcomingMovies"
                ></div>
                <button
                    class="carousel-arrow right"
                    onclick="scrollMovies('upcomingMovies', 1)"
                >
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
        </section>
    </main>
    <button
        class="chat-button"
        onclick="openChatbot()"
        title="Chatbot"
    >
        <i class="fa-solid fa-comment"></i>
    </button>
    <footer class="footer">
        <p>
            Copyright © LOQO Cinema
        </p>
        <div class="footer-social">
            <p class="Contact">Contact:</p>
            <i class="fa-brands fa-facebook"></i>
            <i class="fa-brands fa-instagram"></i>
            <i class="fa-brands fa-github"></i>
        </div>
    </footer>
    <script src="main.js"></script>
</body>
</html>
