<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Signinandup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" >
</head>
<body>
    <header class="logo">
        LOQO<span>•</span>
    </header>
    <div class="background-overlay"></div>
    <main class="auth-container">
        <section class="auth-box" id="signInBox">
            <h1>Sign In</h1>
            <form id="signInForm">
                <div class="input-box">
                    <input
                        type="text"
                        id="loginEmail"
                        placeholder="Email or phone number"
                        required
                    >
                </div>
                <div class="input-box password-box">
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Password"
                        required
                    >
                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('loginPassword', this)"
                    >
                        👁
                    </button>
                </div>
                <div class="forgot">
                    <a href="#">Forgot password?</a>
                </div>
                <button type="submit" class="main-button">
                    Sign In
                </button>
                <label class="remember">
                    <input type="checkbox">
                    <span>Remember me</span>
                </label>
            </form>
            <div class="switch-text">
                Don't have an account?
                <button onclick="showSignUp()">Sign Up</button>
            </div>
            <div class="divider">
                <span></span>
                <p>Or sign in with</p>
                <span></span>
            </div>
            <div class="social-buttons">
                <button class="social google" onclick="socialLogin('Google')">
                    <i class="fa-brands fa-google"></i>
                </button>
                <button class="social facebook" onclick="socialLogin('Facebook')">
                    <i class="fa-brands fa-facebook-f"></i>
                </button>
            </div>
        </section>
        <section class="auth-box signup-box hidden" id="signUpBox">
            <h1>Sign Up</h1>
            <form id="signUpForm">
                <div class="input-box">
                    <input
                        type="text"
                        id="signupName"
                        placeholder="Full name"
                        required
                    >
                </div>
                <div class="input-box">
                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Email address"
                        required
                    >
                </div>
                <div class="input-box password-box">
                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Password"
                        required
                    >
                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('signupPassword', this)"
                    >
                        👁
                    </button>
                </div>
                <div class="input-box password-box">
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm password"
                        required
                    >
                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('confirmPassword', this)"
                    >
                        👁
                    </button>
                </div>
                <button type="submit" class="main-button">
                    Sign Up
                </button>
            </form>
            <div class="switch-text">
                Already have an account?
                <button onclick="showSignIn()">Sign In</button>
            </div>
            <div class="divider">
                <span></span>
                <p>Or sign up with</p>
                <span></span>
            </div>
            <div class="social-buttons">
                <button class="social google" onclick="socialLogin('Google')">
                    <i class="fa-brands fa-google"></i>
                </button>
                <button class="social facebook" onclick="socialLogin('Facebook')">
                    <i class="fa-brands fa-facebook-f"></i>
                </button>
            </div>
        </section>
    </main>
    <script src="Signinandup.js"></script>
</body>
</html>
