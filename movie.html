<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="movie.css">
</head>
<body>
<header class="header">
    <div class="logo" onclick="goHome()">LOQO</div>
    <nav class="navigation">
        <a href="index.html#trending">Trending</a>
        <a href="index.html#popular">Popular</a>
        <a href="index.html#top-rated">Top Rated</a>
        <a href="index.html#upcoming">Upcoming</a>
    </nav>
    <div class="header-icons">
        <button class="icon-button" onclick="goHome()" title="Home">
            <i class="fa-solid fa-house"></i>
        </button>
        <button class="icon-button" onclick="goToSignIn()" title="Sign In">
            <i class="fa-solid fa-right-to-bracket"></i>
        </button>
    </div>
</header>
<section class="movie-hero" id="movieHero">
    <div class="movie-overlay"></div>
    <div class="movie-details">
        <img id="moviePoster" class="movie-poster" src="" alt="Movie Poster">
        <div class="movie-info">
            <h1 id="movieTitle">Loading...</h1>
            <div class="movie-meta">
                <span id="movieYear">----</span>
                <span>•</span>
                <span id="movieRuntime">-- min</span>
                <span>•</span>
                <span id="movieRating">⭐ --</span>
                <span>•</span>
                <span id="movieAge">Age --</span>
            </div>
            <div id="movieGenres" class="movie-genres"></div>
            <p id="movieOverview">
                Loading movie information...
            </p>
            <div class="buttons">
                <button class="watch-button" onclick="watchMovie()">
                    <i class="fa-regular fa-circle-play"></i>
                    Watch Now
                </button>
                <button class="back-button" onclick="goHome()">
                    <i class="fa-solid fa-arrow-left"></i>
                    Back
                </button>
            </div>
        </div>
    </div>
</section>
<section class="video-section" id="videoSection">
    <h2>Watch Movie</h2>
    <div class="video-container">
        <video id="movieVideo" controls>
            <source id="videoSource" src="" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <p id="videoMessage"></p>
    </div>
</section>
<footer class="footer">
    <p>Copyright © LOQO Cinema</p>
    <div class="footer-social">
        <p>Contact:</p>
        <i class="fa-brands fa-facebook"></i>
        <i class="fa-brands fa-instagram"></i>
        <i class="fa-brands fa-github"></i>
    </div>
</footer>
<script src="movie.js"></script>
</body>
</html>
