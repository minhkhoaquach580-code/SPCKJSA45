<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/CSS/profile.css">
    <link rel="icon" href="/IMG/LOQO_logo.jpg" type="image/x-icon">
</head>
<body>
<header class="header">
    <div class="logo" onclick="goHome()">LOQO</div>
    <nav class="navigation">
        <a href="index.html#trending">Trending</a>
        <a href="index.html#popular">Popular</a>
        <a href="index.html#top-rated">Top Rated</a>
        <a href="index.html#upcoming">Upcoming</a>
    </nav>
    <div class="header-icons">
        <button class="icon-button" onclick="goHome()" title="Home">
            <i class="fa-solid fa-house"></i>
        </button>
        <button class="profile-button active" title="Profile">
            <i class="fa-solid fa-circle-user"></i>
        </button>
    </div>
</header>
<main class="profile-page">
    <section class="profile-header">
        <div class="profile-avatar" id="profileAvatar">
            <i class="fa-solid fa-user"></i>
        </div>
        <div class="profile-main-info">
            <h1 id="profileName">User</h1>
            <p id="profileEmail">user@example.com</p>
            <button class="edit-button" onclick="openEditProfile()">
                <i class="fa-solid fa-pen"></i>
                Edit Profile
            </button>
        </div>
    </section>
    <section class="profile-stats">
        <div class="stat">
            <i class="fa-solid fa-heart"></i>
            <div>
                <strong id="favoriteCount">0</strong>
                <span>Favorites</span>
            </div>
        </div>
        <div class="stat">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <div>
                <strong id="watchedCount">0</strong>
                <span>Recently Watched</span>
            </div>
        </div>
        <div class="stat">
            <i class="fa-regular fa-comments"></i>
            <div>
                <strong id="commentCount">0</strong>
                <span>Comments</span>
            </div>
        </div>
    </section>
    <section class="profile-section">
        <div class="section-heading">
            <h2>
                <i class="fa-solid fa-heart"></i>
                Favorite Movies
            </h2>
        </div>
        <div id="favoriteMovies" class="movie-grid"></div>
    </section>
    <section class="profile-section">
        <div class="section-heading">
            <h2>
                <i class="fa-solid fa-clock-rotate-left"></i>
                Recently Watched
            </h2>
        </div>
        <div id="watchedMovies" class="movie-grid"></div>
    </section>
    <section class="profile-section">
        <div class="section-heading">
            <h2>
                <i class="fa-regular fa-comments"></i>
                My Comments
            </h2>
        </div>
        <div id="userComments" class="comments-list"></div>
    </section>
    <section class="account-section">
        <button class="sign-out-button" onclick="signOut()">
            <i class="fa-solid fa-right-from-bracket"></i>
            Sign Out
        </button>
    </section>
</main>
<div id="editProfileModal" class="profile-modal">
    <div class="modal-content">
        <button class="close-modal" onclick="closeEditProfile()">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <h2>Edit Profile</h2>
        <label for="editName">Username</label>
        <input type="text" id="editName" maxlength="30">
        <label for="editEmail">Email</label>
        <input type="email" id="editEmail">
        <label for="editAvatar">Avatar URL</label>
        <input type="text" id="editAvatar" placeholder="https://example.com/avatar.jpg">
        <button class="save-button" onclick="saveProfile()">
            <i class="fa-solid fa-check"></i>
            Save Changes
        </button>
    </div>
</div>
<footer class="footer">
    <p>Copyright © LOQO Cinema</p>
    <div class="footer-social">
        <p>Contact:</p>
        <i class="fa-brands fa-facebook"></i>
        <i class="fa-brands fa-instagram"></i>
        <i class="fa-brands fa-github"></i>
    </div>
</footer>
<script src="/JS/profile.js"></script>
</body>
</html>
