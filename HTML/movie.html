<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie - LOQO Cinema</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/CSS/movie.css">
    <link rel="icon" href="/IMG/LOQO_logo.jpg" type="image/x-icon">
</head>
<body>
<header class="header">
    <div class="logo" onclick="goHome()">LOQO</div>
    <nav class="navigation">
        <a href="index.html#trending">Trending</a>
        <a href="index.html#popular">Popular</a>
        <a href="index.html#top-rated">Top Rated</a>
        <a href="index.html#upcoming">Upcoming</a>
        <a href="favorites.html">Favorites</a>
    </nav>
    <div class="header-icons">
        <button class="icon-button" onclick="goHome()" title="Home">
            <i class="fa-solid fa-house"></i>
        </button>
        <button class="icon-button" onclick="goToSignOut()" title="Sign Out">
            <i class="fa-solid fa-right-to-bracket"></i>
        </button>
    </div>
</header>
<section class="movie-hero" id="movieHero">
    <div class="movie-overlay"></div>
    <div class="movie-details">
        <img id="moviePoster" class="movie-poster" src="" alt="Movie Poster">
        <div class="movie-info">
            <h1 id="movieTitle">Loading...</h1>
            <div class="movie-meta">
                <span id="movieYear">----</span>
                <span>•</span>
                <span id="movieRuntime">-- min</span>
                <span>•</span>
                <span id="movieRating">⭐ --</span>
                <span>•</span>
                <span id="movieAge">Age --</span>
            </div>
            <div id="movieGenres" class="movie-genres"></div>
            <p id="movieOverview">Loading movie information...</p>
            <div class="buttons">
                <button class="watch-button" onclick="watchMovie()">
                    <i class="fa-regular fa-circle-play"></i> Watch Now
                </button>
                <button class="favorite-button" id="favoriteButton" onclick="toggleFavorite()">
                    <i class="fa-regular fa-heart"></i> Add to Favorites
                </button>
                <button class="back-button" onclick="goHome()">
                    <i class="fa-solid fa-arrow-left"></i> Back
                </button>
            </div>
        </div>
    </div>
</section>
<section class="video-section" id="videoSection">
    <h2>Watch Movie</h2>
    <div class="video-container">
        <iframe
            id="movieVideo"
            title="Movie Trailer"
            frameborder="0"
            allowfullscreen>
        </iframe>
        <p id="videoMessage"></p>
    </div>
</section>
<section class="comments-section">
    <div class="comments-wrapper">
        <h2>
            <i class="fa-regular fa-comments"></i>
            Comments
        </h2>
        <form id="commentForm" class="comment-form">
            <input
                type="text"
                id="commentName"
                placeholder="Your name"
                maxlength="30"
                required
            >
            <textarea
                id="commentText"
                placeholder="Write a comment about this movie..."
                maxlength="500"
                required
            ></textarea>
            <button type="submit">
                <i class="fa-solid fa-paper-plane"></i>
                Post Comment
            </button>
        </form>
        <div id="commentsList" class="comments-list"></div>
    </div>
</section>
<footer class="footer">
    <p>Copyright © LOQO Cinema</p>
    <div class="footer-social">
        <p>Contact:</p>
        <i class="fa-brands fa-facebook"></i>
        <i class="fa-brands fa-instagram"></i>
        <i class="fa-brands fa-github"></i>
    </div>
</footer>
<script src="/JS/movie.js"></script>
</body>
</html>
